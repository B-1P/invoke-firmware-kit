# Wi-Fi onboarding defaults for the Harman Kardon Invoke ("Podium") custom firmware.
#
# Do not edit this copy inside the firmware image. To change a setting on a
# speaker, create /data/onboarding/onboarding.conf containing only the lines you
# want to override, for example:
#
#     WIFI_COUNTRY=DE
#     AP_PASSPHRASE=letmein123
#
# This file is read by /bin/sh, so use NAME=value with no spaces around "=".

# --- The setup network the speaker creates --------------------------------
# Network name is "<prefix>-XXXX", XXXX = last 4 hex digits of the Wi-Fi MAC.
AP_SSID_PREFIX=Invoke-Setup
# Empty = open network (recommended, see README). 8-63 characters = WPA2.
AP_PASSPHRASE=
# 2.4 GHz channel for the setup network (1, 6 or 11 are safe everywhere).
# Only used while the speaker is NOT connected to Wi-Fi: the radio can serve
# one channel at a time, so when it is connected the setup network uses the
# home network's channel. If this channel fails, 1, 6 and 11 are tried.
AP_CHANNEL=6
# Address of the speaker on the setup network (the portal lives here).
AP_IP=192.168.4.1
AP_NETMASK=255.255.255.0
AP_DHCP_START=192.168.4.10
AP_DHCP_END=192.168.4.60

# --- Your home network ------------------------------------------------------
# Two-letter country code for Wi-Fi regulatory rules (allowed channels).
# Empty = keep whatever the firmware's wpa_supplicant.conf.in says (US).
WIFI_COUNTRY=

# --- Timing (seconds) -------------------------------------------------------
# At boot: how long to wait for the saved Wi-Fi before starting setup mode.
BOOT_TIMEOUT=60
# Joining a network typed into the portal: time to associate...
JOIN_TIMEOUT=45
# ...and then to get an IP address from the router.
DHCP_TIMEOUT=30
# In setup mode, every RETRY_INTERVAL seconds (when nobody is using the setup
# page) the speaker briefly retries the previously saved network for
# RETRY_WINDOW seconds. This handles "router was off when the speaker booted".
RETRY_INTERVAL=300
RETRY_WINDOW=45
# Setup mode started by hand ("onboarding start", power-cycle trick) gives up
# after this long if nobody submits anything, and goes back to normal.
FORCE_TIMEOUT=900
# If >0: after Wi-Fi has been lost for this long while running, start setup
# mode (it closes again by itself once the saved network is back). 0 = off.
LOST_TIMEOUT=0

# --- Power-cycle trick --------------------------------------------------------
# Unplugging the speaker RAPID_BOOTS times in a row, each time within
# RAPID_WINDOW seconds after onboarding started, forces setup mode on the
# next boot. 0 disables the trick.
RAPID_BOOTS=3
RAPID_WINDOW=90

# --- Paths (normally no need to change) ---------------------------------------
STATE_DIR=/data/onboarding
RUN_DIR=/tmp/onboarding
# Where onboarding.log is kept. On /data it survives power cuts, so a
# failed setup can still be diagnosed after unplugging the speaker.
LOG_DIR=/data/onboarding
STA_IFACE=wlan0
AP_IFACE=p2p0
WIFI_CONF=/data/wifi/wpa_supplicant.conf
WIFI_CONF_IN=/system/etc/wpa_supplicant.conf.in
WPA_CTRL=/data/wifi
PORTAL_PORT=80
